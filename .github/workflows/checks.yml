name: Check map

on:
  pull_request:
  push:
    paths: ["web/**", "pipeline/**", "tools/**", "site/data/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check source and credential handling
        run: |
          python3 -m py_compile pipeline/*.py
          python3 -m unittest discover -s tools -p 'test_*.py'
          node --check web/app.js
          node --check web/geom.js
          node --check web/ribbons.js
      - name: Check route geometry across zoom levels
        run: |
          node tools/geometry_check.js
          node tools/ribbon_check.js
      - name: Build the keyless website
        run: python3 pipeline/build_site.py
