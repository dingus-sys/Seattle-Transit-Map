name: Check map

on:
  pull_request:
  push:
    paths: ["web/**", "pipeline/**", "tools/**", "site/data/**", "requirements.txt", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pipeline test dependencies
        run: pip install -r requirements.txt
      - name: Check source and credential handling
        run: |
          python3 -m py_compile pipeline/*.py
          python3 -m unittest discover -s tools -p 'test_*.py'
          node --check web/app.js
          node --check web/geom.js
          node --check web/ribbons.js
      - name: Check route geometry across zoom levels
        run: |
          node tools/geometry_check.js
          node tools/ribbon_check.js
          node tools/strandorder.js
          node tools/test_routing_engine.js
          node tools/stress_test_routing.js
          node tools/test_click_hovered_route.js
          node tools/test_overflow_tag_corridor.js
          python3 tools/validate_data.py
          python3 tools/check_repair.py
      - name: Build the keyless website
        run: python3 pipeline/build_site.py
      - name: Run Playwright browser test sweep
        run: |
          npx playwright install --with-deps chromium
          python3 -m http.server -d site 8765 &
          sleep 2
          node tools/sweep.js
          node tools/test_hover_cards.js
