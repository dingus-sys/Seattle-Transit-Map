name: Publish map to GitHub Pages

# Needs Settings -> Pages -> Source: "GitHub Actions" (free for public repositories).
# Optional: a repository secret OBA_API_KEY turns on live vehicle positions and service alerts;
# WSF_ACCESS_CODE (a free WSDOT access code) adds ferry bulletins and vessel details.

on:
  push:
    branches: [main]
    paths: ["site/**", "web/**", "pipeline/build_site.py", "pipeline/config.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The page (index.html, app.js, app.css, geom.js, logos/) is built here from web/ and is
      # not kept in the repository; the data in site/data and site/tiles is.
      - name: Build the page
        run: |
          python3 pipeline/build_site.py
          rm site/artifact.html   # the one-file claude.ai preview, not part of the website
      - name: Add the live-data key (from the OBA_API_KEY repository secret)
        env:
          OBA_API_KEY: ${{ secrets.OBA_API_KEY }}
        run: |
          if [ -n "$OBA_API_KEY" ]; then
            sed -i "s/__OBA_API_KEY__/${OBA_API_KEY}/" site/index.html
          else
            echo "No OBA_API_KEY secret: the map will show timetable estimates instead of live positions."
          fi
      - name: Add the ferry access code (from the WSF_ACCESS_CODE repository secret)
        env:
          # a repository secret, or a repository variable of the same name
          WSF_ACCESS_CODE: ${{ secrets.WSF_ACCESS_CODE || vars.WSF_ACCESS_CODE }}
        run: |
          # without one the placeholder is cleared and ferries come from OneBusAway alone
          if [ -z "$WSF_ACCESS_CODE" ]; then echo "No WSF_ACCESS_CODE secret or variable: ferry bulletins stay off."; fi
          sed -i "s/__WSF_ACCESS_CODE__/${WSF_ACCESS_CODE}/" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
