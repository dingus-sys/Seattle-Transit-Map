name: Publish map to GitHub Pages

# Needs Settings -> Pages -> Source: "GitHub Actions" (free for public repositories).
# Optional: a repository secret OBA_API_KEY turns on live vehicle positions and service alerts;
# WSF_ACCESS_CODE (a free WSDOT access code) adds ferry bulletins and vessel details.

on:
  push:
    branches: [main]
    paths: ["site/**", "web/**", "pipeline/**", "tools/**", "requirements.txt", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pipeline test dependencies
        run: pip install -r requirements.txt
      - name: Check source syntax and route geometry before publishing
        run: |
          node --check web/app.js
          node --check web/geom.js
          node --check web/ribbons.js
          python3 -m unittest discover -s tools -p 'test_*.py'
          node tools/geometry_check.js
          node tools/ribbon_check.js
          node tools/test_routing_engine.js
          node tools/stress_test_routing.js
          python3 tools/validate_data.py
          python3 tools/check_repair.py
      - uses: actions/configure-pages@v5
      # The page (index.html, app.js, app.css, geom.js, ribbons.js, logos/) is built here from web/ and is
      # not kept in the repository; the data in site/data and site/tiles is.
      - name: Build the page
        env:
          OBA_API_KEY: ${{ secrets.OBA_API_KEY }}
          WSF_ACCESS_CODE: ${{ secrets.WSF_ACCESS_CODE || vars.WSF_ACCESS_CODE || secrets.WSF_KEY || secrets.WSP_KEY || secrets.WSDOT_KEY }}
          WSDOT_KEY: ${{ secrets.WSDOT_KEY || secrets.WSDOT_ACCESS_CODE || secrets.WSF_ACCESS_CODE || secrets.WSP_KEY }}
        run: |
          python3 pipeline/build_site.py --with-key
          rm site/artifact.html   # the one-file claude.ai preview, not part of the website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
