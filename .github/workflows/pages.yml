name: Publish map to GitHub Pages

# Needs Settings -> Pages -> Source: "GitHub Actions" (free for public repositories).
# Optional: a repository secret OBA_API_KEY turns on live vehicle positions and service alerts;
# WSF_ACCESS_CODE (a free WSDOT access code) adds ferry bulletins and vessel details.

on:
  push:
    branches: [main]
    paths: ["site/**", "web/**", "pipeline/**", "tools/**", "requirements.txt", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pipeline test dependencies
        run: pip install -r requirements.txt
      - name: Check source syntax and route geometry before publishing
        run: |
          node --check web/app.js
          node --check web/geom.js
          node --check web/ribbons.js
          python3 -m unittest discover -s tools -p 'test_*.py'
          node tools/geometry_check.js
          node tools/ribbon_check.js
          node tools/test_routing_engine.js
          node tools/stress_test_routing.js
          python3 tools/validate_data.py
          python3 tools/check_schedule_release.py   # known timetable mistakes: restrictions, Amtrak times, route identity
          python3 tools/check_stop_coverage.py --max-far 3   # stops on a route's own patterns sit on its drawn line
          python3 tools/check_repair.py
          python3 tools/check_parallel_copies.py   # routes on one street share one bundle
          python3 tools/check_bikes.py   # one clean line per bike route: no doubles, breaks or angles
      - uses: actions/configure-pages@v5
      # The page (index.html, app.js, app.css, geom.js, ribbons.js, logos/) is built here from web/ and is
      # not kept in the repository; the data in site/data and site/tiles is.
      - name: Build the page
        env:
          OBA_API_KEY: ${{ secrets.OBA_API_KEY }}
          WSF_ACCESS_CODE: ${{ secrets.WSF_ACCESS_CODE || vars.WSF_ACCESS_CODE || secrets.WSF_KEY || secrets.WSP_KEY || secrets.WSDOT_KEY }}
          WSDOT_KEY: ${{ secrets.WSDOT_KEY || secrets.WSDOT_ACCESS_CODE || secrets.WSF_ACCESS_CODE || secrets.WSP_KEY }}
          # the Cloudflare Worker URL (worker/README.md); when set, the page carries no keys
          LIVE_PROXY: ${{ vars.LIVE_PROXY }}
        run: |
          python3 pipeline/build_site.py --with-key
          rm site/artifact.html   # the one-file claude.ai preview, not part of the website
      # The artifact's name carries the attempt number: re-running a failed job adds a second
      # artifact called "github-pages" to the same run, and deploy-pages refuses to choose
      # between two ("Multiple artifacts named github-pages were unexpectedly found").
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site

  # Deploying in its own job: in the same job, deploy-pages looked up the artifact seconds after
  # the upload and sometimes found none yet ("Found 0 artifact(s)", Nov 27, three runs in a row).
  # A later job only starts once the build job, and its artifact, are finished.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
