name: Extract OpenStreetMap ways for the bike network

# Runs tools/extract_bike_osm.py where the tiles can be downloaded and commits
# pipeline/bike_osm.json.gz back to the same working branch. Only on working branches:
# main never runs it (the result is committed data, rebuilt only when the bike data changes).
on:
  push:
    branches: ["claude/**"]
    paths: ["tools/extract_bike_osm.py", ".github/workflows/bike-osm.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python3 tools/extract_bike_osm.py
      - name: Commit the extract to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/bike_osm.json.gz
          git commit -m "OpenStreetMap ways near the bike network (tools/extract_bike_osm.py)" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
