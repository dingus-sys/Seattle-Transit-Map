name: Refresh transit data

# Rebuilds routes, stops, schedules and the bundled network from the latest
# agency feeds every Monday, and commits the result (which re-publishes the site).
on:
  schedule:
    - cron: "17 11 * * 1"   # Mondays, 4:17 AM Pacific (standard time)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # street matching takes ~11 min and the graph build ~30 for the Bellingham-Olympia region;
    # 40 minutes left no room
    timeout-minutes: 120
    env:
      TRANSIT_CACHE: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/check_repair.py
      - run: python pipeline/build_all.py --no-tiles --fresh
      - run: python tools/validate_data.py
      - run: python tools/check_schedule_release.py --feeds
      - run: python3 tools/check_stop_coverage.py --max-far 3   # stops on a route's own patterns sit on its drawn line
      - run: python tools/check_parallel_copies.py   # routes on one street share one bundle
      - name: Commit updated data
        run: |
          git config user.name "transit-data-bot"
          git config user.email "transit-data-bot@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh transit data $(date -u +%Y-%m-%d)"
          # main may have moved during the ~35-minute build: rebase onto it and retry, so a
          # push from someone else doesn't throw the whole refresh away
          for i in 1 2 3 4; do
            git push && break
            if [ "$i" = 4 ]; then echo "push failed after 4 tries"; exit 1; fi
            sleep $((i * 10))
            git pull --rebase origin main
          done
          gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
