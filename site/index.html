<style>/* Layout: full-bleed map under floating liquid-glass surfaces — a sidebar card (a pull-up
   sheet on phones) and a control stack on the right. Type: Apple's system face (SF Pro on
   Apple devices; the platform UI face elsewhere). Motion: springs that overshoot slightly,
   so taps, toggles and popups settle with a soft, jelly-like give. */
:root {
  --map: #f2f2ef;
  --ink: #1d1d1f;
  --ink-2: #3a3a3c;
  --muted: #6e6e73;
  --hairline: rgba(60, 60, 67, .16);
  --fill: rgba(118, 118, 128, .12);
  --fill-2: rgba(118, 118, 128, .2);
  --group: rgba(255, 255, 255, .66);
  --glass: rgba(255, 255, 255, .42);
  --glass-clear: rgba(255, 255, 255, .22);
  --glass-solid: rgba(248, 248, 250, .94);
  --rim: rgba(255, 255, 255, .55);
  --rim-hi: rgba(255, 255, 255, 1);
  --rim-lo: rgba(255, 255, 255, .18);
  --shine: rgba(255, 255, 255, .75);
  --glow: rgba(255, 255, 255, .55);
  --shadow: 0 .5px 0 rgba(0, 0, 0, .04), 0 8px 20px rgba(24, 28, 44, .08), 0 24px 56px rgba(24, 28, 44, .14);
  --accent: #007aff;
  --on: #34c759;
  --good: #1f8a3b;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --spring-soft: cubic-bezier(.2, 1.3, .4, 1);
  --ease-out: cubic-bezier(.22, .61, .36, 1);
  --r-sheet: 26px;
  --r-group: 14px;
  --panel-w: 384px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --map: #1c1c1e; --ink: #f5f5f7; --ink-2: #e5e5ea; --muted: #98989d; --hairline: rgba(84, 84, 88, .6);
    --fill: rgba(118, 118, 128, .24); --fill-2: rgba(118, 118, 128, .34); --group: rgba(255, 255, 255, .07);
    --glass: rgba(30, 30, 33, .5); --glass-clear: rgba(30, 30, 33, .28); --glass-solid: rgba(36, 36, 38, .95);
    --rim: rgba(255, 255, 255, .12); --rim-hi: rgba(255, 255, 255, .5); --rim-lo: rgba(255, 255, 255, .05);
    --shine: rgba(255, 255, 255, .16); --glow: rgba(255, 255, 255, .14); --shadow: 0 0 0 .5px rgba(0, 0, 0, .6), 0 10px 26px rgba(0, 0, 0, .4), 0 26px 64px rgba(0, 0, 0, .45);
    --accent: #0a84ff; --on: #30d158; --good: #4cd964;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --map: #1c1c1e; --ink: #f5f5f7; --ink-2: #e5e5ea; --muted: #98989d; --hairline: rgba(84, 84, 88, .6);
  --fill: rgba(118, 118, 128, .24); --fill-2: rgba(118, 118, 128, .34); --group: rgba(255, 255, 255, .07);
  --glass: rgba(30, 30, 33, .5); --glass-clear: rgba(30, 30, 33, .28); --glass-solid: rgba(36, 36, 38, .95);
  --rim: rgba(255, 255, 255, .12); --rim-hi: rgba(255, 255, 255, .5); --rim-lo: rgba(255, 255, 255, .05);
  --shine: rgba(255, 255, 255, .16); --glow: rgba(255, 255, 255, .14); --shadow: 0 0 0 .5px rgba(0, 0, 0, .6), 0 10px 26px rgba(0, 0, 0, .4), 0 26px 64px rgba(0, 0, 0, .45);
  --accent: #0a84ff; --on: #30d158; --good: #4cd964;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--map); color: var(--ink);
  font: 400 15px/1.35 var(--font); letter-spacing: -.01em;
  overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
#map { position: fixed; inset: 0; }
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; border-radius: 10px; }

/* ---------- Liquid glass ---------- */
/* Clear glass: the map shows through, lightly blurred and brightened. A specular rim
   catches light on the top-left and bottom-right edges, the inside edge glows like thick
   glass bending light, and a soft highlight follows the pointer across the surface. */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(18px) saturate(185%) brightness(1.04);
  backdrop-filter: blur(18px) saturate(185%) brightness(1.04);
  box-shadow:
    inset 0 0 0 .5px var(--rim),
    inset 1.5px 1.5px 1px -1px var(--rim-hi),
    inset -1px -1px 1px -.5px var(--rim-lo),
    inset 0 0 18px -6px var(--glow),
    var(--shadow);
  isolation: isolate;
}
.glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
  background:
    radial-gradient(280px circle at var(--mx, 18%) var(--my, -10%), var(--glow), transparent 62%),
    linear-gradient(160deg, rgba(255, 255, 255, .16), transparent 34%, transparent 70%, rgba(255, 255, 255, .08));
  transition: background .2s linear;
}
.glass::after {
  /* the rim itself: a 1px ring, brightest where light would strike */
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; padding: 1px;
  background: linear-gradient(135deg, var(--rim-hi) 0%, var(--rim-lo) 32%, var(--rim-lo) 62%, var(--rim) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass { background: var(--glass-solid); }
}

/* jelly press: quick squash, springy release */
.press, .row, .result, .ctl, .back, .chip, .segmented button, .ctl-group {
  transition: transform .6s var(--spring), background-color .2s ease;
}
.press:active, .result:active, .back:active, .route-row:active { transform: scale(.96); transition-duration: .12s; }
.ctl:active { transform: scale(.9); transition-duration: .12s; }
.squish { animation: squish .62s var(--ease-out); }
@keyframes squish {
  0% { transform: scale(1, 1); }
  22% { transform: scale(1.07, .9); }
  44% { transform: scale(.95, 1.06); }
  64% { transform: scale(1.025, .98); }
  82% { transform: scale(.995, 1.008); }
  100% { transform: scale(1, 1); }
}

@keyframes jelly-in {
  0% { opacity: 0; transform: translateY(12px) scale(.97); }
  55% { opacity: 1; transform: translateY(-2px) scale(1.01); }
  80% { transform: translateY(1px) scale(.997); }
  100% { opacity: 1; transform: none; }
}
@keyframes jelly-pop {
  0% { opacity: 0; transform: scale(.82); }
  45% { opacity: 1; transform: scale(1.05); }
  70% { transform: scale(.98); }
  100% { transform: scale(1); }
}
@keyframes wobble {
  0% { transform: scale(1, 1); }
  30% { transform: scale(1.12, .9); }
  50% { transform: scale(.94, 1.06); }
  70% { transform: scale(1.03, .98); }
  100% { transform: scale(1, 1); }
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Sheet (sidebar / bottom sheet) ---------- */
.sheet {
  position: fixed; z-index: 5;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: max(12px, env(safe-area-inset-left, 0px));
  width: var(--panel-w);
  max-height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column;
  border-radius: var(--r-sheet);
  animation: jelly-in .7s var(--ease-out) both;
}
.sheet-head { padding: 14px 16px 12px; display: grid; gap: 12px; }
.grabber { display: none; }
.title-row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.app-icon { flex: none; width: 44px; height: 44px; border-radius: 11px; box-shadow: 0 2px 6px rgba(0, 0, 0, .18); }
.app-icon svg { display: block; }
.titles { min-width: 0; }
.titles h1 { margin: 0; font: 700 20px/1.15 var(--font-display); letter-spacing: -.02em; text-wrap: balance; }
.titles p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

.search { position: relative; }

/* Filter bar: one chip per kind of service */
.filter-bar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: -2px -16px 0; padding: 0 16px 2px; }
.filter-bar::-webkit-scrollbar { display: none; }
.fchip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px 7px 9px; border-radius: 99px;
  border: 0; background: var(--fill); color: var(--muted); font: 600 13px/1 var(--font); cursor: pointer;
  box-shadow: inset 0 0 0 .5px var(--rim); transition: background-color .25s ease, color .25s ease, box-shadow .25s ease;
}
.fchip .dot { width: 9px; height: 9px; border-radius: 50%; opacity: .35; transition: opacity .25s ease, transform .4s var(--spring); }
.fchip.on { background: var(--glass-solid); color: var(--ink); box-shadow: inset 1px 1px 1px -.5px #fff, inset 0 0 0 .5px var(--rim-hi), 0 2px 8px rgba(0, 0, 0, .08); }
.fchip.on .dot { opacity: 1; transform: scale(1.1); }
.fchip:hover { background: var(--fill-2); }
.fchip.on:hover { background: var(--glass-solid); }
.fchip:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 1px; }
.search > svg { position: absolute; left: 13px; top: 11px; color: var(--muted); pointer-events: none; }
.search input {
  width: 100%; box-sizing: border-box; height: 38px; padding: 0 14px 0 38px;
  border: 0; border-radius: 99px; background: var(--fill); outline-offset: 0;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, .06), inset 0 0 0 .5px rgba(255, 255, 255, .35);
  font-size: 16px; transition: background-color .2s ease, box-shadow .3s var(--spring);
}
.search input::placeholder { color: var(--muted); }
.search input:focus { background: var(--fill-2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); outline: none; }
.search input::-webkit-search-cancel-button { filter: grayscale(1); }
.results {
  position: absolute; left: 0; right: 0; top: 46px; z-index: 3; max-height: 52vh; overflow: auto;
  border-radius: 18px; padding: 6px; animation: jelly-pop .45s var(--spring) both; transform-origin: top center;
}
.result {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; position: relative;
  padding: 8px 10px; border: 0; background: none; border-radius: 12px; cursor: pointer; min-width: 0;
}
.result:hover, .result.active { background: var(--fill); }
.empty { padding: 12px; color: var(--muted); }

.sheet-body { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding: 0 16px 14px; min-height: 0; }
.view { animation: jelly-in .55s var(--ease-out) both; }
.section {
  margin: 18px 4px 7px; font: 600 13px/1 var(--font); letter-spacing: -.005em; color: var(--muted);
}
.view > .section:first-child, .layers-view > .section:first-child, .home-view > .section:first-child { margin-top: 6px; }

/* inset grouped list */
.group {
  list-style: none; margin: 0; padding: 0; background: var(--group); border-radius: var(--r-group); overflow: hidden;
  box-shadow: inset 0 0 0 .5px var(--rim), inset 1px 1px 1px -.5px var(--rim-hi);
}
.group > li { position: relative; }
.group > li + li::before {
  content: ""; position: absolute; top: 0; left: 54px; right: 0; height: .5px; background: var(--hairline);
}
.row {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 12px;
  width: 100%; box-sizing: border-box; padding: 9px 14px 9px 12px; border: 0; background: none; text-align: left;
  cursor: pointer; user-select: none; min-height: 52px;
}
.row:hover { background: var(--fill); }
.txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.txt .name { font-weight: 600; font-size: 15px; display: flex; align-items: baseline; gap: 6px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.txt .desc { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.count { font-weight: 500; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.icon { width: 30px; height: 30px; border-radius: 8px; background: var(--fill); display: grid; place-items: center; }
.icon svg { width: 30px; height: 30px; display: block; }
.layer.off .icon, .layer.off .txt { opacity: .4; transition: opacity .25s ease; }

/* iOS switch; while pressed the knob swells into a clear glass droplet */
.switch { position: relative; display: inline-block; width: 51px; height: 31px; flex: none; cursor: pointer; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch .track {
  position: absolute; inset: 0; border-radius: 99px; background: var(--fill-2);
  transition: background-color .3s ease;
}
.switch .knob {
  position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 99px; background: #fff;
  box-shadow: 0 3px 8px rgba(0, 0, 0, .15), 0 1px 1px rgba(0, 0, 0, .16), 0 3px 1px rgba(0, 0, 0, .06);
  transition: transform .55s var(--spring), width .4s var(--spring), background-color .25s ease, box-shadow .25s ease;
}
.switch input:checked + .track { background: var(--on); }
.switch input:checked + .track .knob { transform: translateX(20px); }
.switch input:active + .track .knob {
  width: 35px; transform: scale(1.18, 1.12); background: rgba(255, 255, 255, .32);
  -webkit-backdrop-filter: blur(1.5px) saturate(160%); backdrop-filter: blur(1.5px) saturate(160%);
  box-shadow: inset 1.5px 1.5px 1px -1px #fff, inset -1px -1px 1px -.5px rgba(255, 255, 255, .5), inset 0 0 0 .5px rgba(255, 255, 255, .7), 0 4px 14px rgba(0, 0, 0, .18);
}
.switch input:checked:active + .track .knob { transform: translateX(12px) scale(1.18, 1.12); }
.switch input:focus-visible + .track { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }

.hint { color: var(--muted); font-size: 12.5px; margin: 14px 4px 2px; line-height: 1.45; }

/* ---------- Simple home: live status, Layers entry, map key ---------- */
.live-line { display: flex; align-items: center; gap: 8px; margin: 6px 4px 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.live-line .pulse { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--on); animation: live-pulse 1.8s ease-out infinite; }
.live-line.off .pulse { background: var(--muted); opacity: .5; animation: none; }
.nav-row { grid-template-columns: 30px minmax(0, 1fr) auto; }
.nav-row .chev { color: var(--muted); opacity: .6; }
.nav-row .icon { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.key-grid {
  list-style: none; margin: 0; padding: 8px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px;
  background: var(--group); border-radius: var(--r-group);
  box-shadow: inset 0 0 0 .5px var(--rim), inset 1px 1px 1px -.5px var(--rim-hi);
}
.key-grid li { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; padding: 3px 0; }
.key-grid li > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.key-grid .sw { flex: none; width: 26px; height: 22px; display: grid; place-items: center; }
.key-grid .sw svg { width: 30px; height: 30px; }

/* ---------- Layers page ---------- */
.view-head { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 4px 2px; }
.view-title { margin: 0; font: 700 24px/1.15 var(--font-display); letter-spacing: -.02em; }
.text-btn { border: 0; background: none; color: var(--accent); font: 500 15px/1 var(--font); padding: 6px 8px; margin-right: -8px; border-radius: 8px; cursor: pointer; }
.text-btn:hover { background: var(--fill); }
.settings > li { display: grid; gap: 8px; padding: 11px 14px 12px; }
.settings > li + li::before { left: 14px; }
.settings .sname { font-weight: 600; font-size: 14.5px; }
.settings .segmented { margin: 0; }

/* ---------- Route & stop cards ---------- */
.back {
  display: inline-flex; align-items: center; gap: 6px; margin: 2px 0 2px -4px; padding: 6px 10px 6px 6px;
  border: 0; background: none; color: var(--accent); font-size: 16px; font-weight: 500; cursor: pointer; border-radius: 10px;
}
.back:hover { background: var(--fill); }
.hero { display: flex; gap: 14px; align-items: center; margin: 8px 2px 12px; }
.hero h2 { margin: 0; font: 700 22px/1.15 var(--font-display); letter-spacing: -.02em; text-wrap: balance; }
.hero p { margin: 3px 0 0; color: var(--muted); font-size: 13.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 99px;
  background: var(--fill); font-size: 12.5px; font-weight: 600;
}
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.live-chip { background: color-mix(in srgb, var(--on) 14%, transparent); }
.live-chip .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--on); animation: live-pulse 1.8s ease-out infinite; }
@keyframes live-pulse {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--on) 60%, transparent); }
  70% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--on) 0%, transparent); }
  100% { box-shadow: 0 0 0 0 transparent; }
}
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile {
  display: flex; flex-direction: column; gap: 3px; background: var(--group); border-radius: var(--r-group); padding: 11px 13px; min-width: 0;
  box-shadow: inset 0 0 0 .5px var(--rim), inset 1px 1px 1px -.5px var(--rim-hi);
}
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font: 700 20px/1.15 var(--font-display); letter-spacing: -.02em; }
.tile .v.sm { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.tile .v small { font-size: 13px; font-weight: 500; color: var(--muted); }

.table-group { overflow-x: auto; }
table.sched { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.sched th, table.sched td { padding: 9px 10px; text-align: right; white-space: nowrap; }
table.sched tbody tr + tr th, table.sched tbody tr + tr td { border-top: .5px solid var(--hairline); }
table.sched thead th { font-size: 11.5px; font-weight: 600; color: var(--muted); padding-top: 10px; padding-bottom: 4px; }
table.sched th[scope="row"] { text-align: left; font-weight: 500; font-size: 14px; }
table.sched th[scope="row"] small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 400; margin-top: 1px; }
table.sched td { font-size: 13.5px; font-weight: 500; }
table.sched td.none { color: var(--muted); font-weight: 400; }
table.sched td.good { color: var(--good); font-weight: 650; }
.foot { color: var(--muted); font-size: 12px; margin: 8px 4px 0; line-height: 1.4; }

.segmented {
  position: relative; display: flex; padding: 2px; background: var(--fill); border-radius: 10px; margin: 0 0 10px;
}
.segmented button {
  position: relative; z-index: 1; flex: 1; min-width: 0; border: 0; background: none; padding: 7px 8px; border-radius: 8px;
  cursor: pointer; font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.segmented button[aria-selected="true"] { font-weight: 600; }
.segmented { border-radius: 99px; }
.segmented button { border-radius: 99px; }
.seg-thumb {
  position: absolute; z-index: 0; top: 2px; bottom: 2px; left: 2px; border-radius: 99px; background: var(--glass-solid);
  box-shadow: inset 1px 1px 1px -.5px #fff, inset 0 0 0 .5px rgba(255, 255, 255, .6), 0 3px 8px rgba(0, 0, 0, .12);
  transition: transform .55s var(--spring);
}
.seg-thumb.moving { animation: thumb-stretch .55s var(--ease-out); }
@keyframes thumb-stretch { 0% { scale: 1 1; } 35% { scale: 1.12 .9; } 65% { scale: .97 1.04; } 100% { scale: 1 1; } }
.stoplist { counter-reset: s; }
.stoplist > li + li::before { left: 40px; }
.stoplist button {
  display: block; width: 100%; text-align: left; border: 0; background: none; cursor: pointer; position: relative;
  padding: 10px 14px 10px 40px; font-size: 14.5px;
}
.stoplist button:hover { background: var(--fill); }
.stoplist li::after {
  content: ""; position: absolute; left: 17px; top: 0; bottom: 0; width: 5px; background: var(--line-c, var(--accent)); z-index: 0;
}
.stoplist li:first-child::after { top: 50%; }
.stoplist li:last-child::after { bottom: 50%; }
.stoplist button::before {
  content: ""; position: absolute; left: 14px; top: calc(50% - 5.5px); width: 7px; height: 7px; border-radius: 50%;
  background: #fff; border: 2px solid var(--line-c, var(--accent)); z-index: 1;
}
.link-out {
  display: flex; justify-content: center; gap: 6px; align-items: center; margin-top: 14px; padding: 12px;
  border-radius: 14px; background: var(--fill); color: var(--accent); font-weight: 600; text-decoration: none;
}
.link-out:hover { background: var(--fill-2); }

.route-row { grid-template-columns: auto minmax(0, 1fr) auto auto; }
.route-row .hw { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.route-row .chev { color: var(--muted); opacity: .6; }
.group > li:has(.route-row) + li::before { left: 62px; }

.stop-glyph { flex: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2.5px solid #8e8e93; box-sizing: border-box; }
.stop-glyph.big { width: 22px; height: 22px; border: 4px solid var(--ink); }
.hero .stop-glyph { width: 22px; height: 22px; border-width: 3.5px; }
.hero .stop-glyph.big { width: 30px; height: 30px; border-width: 5px; }

/* Route badge (HTML twin of the badges drawn on the map) */
.badge {
  display: inline-grid; place-items: center; min-width: 28px; height: 24px; padding: 0 7px; box-sizing: border-box; flex: none;
  border-radius: 6px; font: 700 13.5px/1 var(--font-display); color: #fff; letter-spacing: -.01em; white-space: nowrap;
}
.badge.round { border-radius: 50%; width: 26px; min-width: 26px; height: 26px; padding: 0; }
.badge.xl { min-width: 46px; height: 40px; font-size: 21px; border-radius: 9px; padding: 0 10px; }
.badge.xl.round { width: 44px; min-width: 44px; height: 44px; border-radius: 50%; }

.credits { margin: 12px 4px 0; color: var(--muted); font-size: 11px; line-height: 1.45; }

/* ---------- Map controls ---------- */
.controls {
  position: fixed; z-index: 4; display: grid; gap: 10px; justify-items: end;
  top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
}
.ctl-group { position: relative; display: grid; border-radius: 99px; overflow: hidden; }
.ctl {
  position: relative; display: grid; place-items: center; width: 44px; height: 44px; border: 0; background: transparent;
  color: var(--ink); cursor: pointer;
}
.ctl:hover { background: var(--fill); }
.ctl-sep { height: .5px; background: var(--hairline); margin: 0 10px; }
.ctl-round { border-radius: 50%; }
.ctl-round:active svg { animation: wobble .5s var(--spring); }

/* ---------- Map overlays ---------- */
.tip {
  position: fixed; z-index: 6; pointer-events: none; border-radius: 14px; padding: 7px 11px; font-size: 13px;
  max-width: 280px; display: flex; gap: 8px; align-items: center; animation: jelly-pop .35s var(--spring) both;
}
.tip .tt { color: var(--ink-2); line-height: 1.3; }
.tip-badges { display: flex; flex-wrap: wrap; gap: 4px; max-width: 220px; }
.tip .tt b { color: var(--ink); font-weight: 600; }
/* vehicle status: on time / late / early, and when the position was updated */
.vs-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 7px; margin-top: 3px; }
.pop .vs-row { margin: 0 4px 8px; }
.vs { display: inline-block; padding: 2px 7px; border-radius: 99px; font-size: 11.5px; font-weight: 650; line-height: 1.35; }
.vs-ok { background: color-mix(in srgb, #1f9d55 16%, transparent); color: #17803f; }
.vs-slow { background: color-mix(in srgb, #e08a00 18%, transparent); color: #a86400; }
.vs-late { background: color-mix(in srgb, #d0213b 15%, transparent); color: #b3122a; }
.vs-early { background: color-mix(in srgb, #2f7fd3 16%, transparent); color: #1d64b3; }
:root[data-dark="1"] .vs-ok { color: #5fd38a; } :root[data-dark="1"] .vs-slow { color: #ffb84d; }
:root[data-dark="1"] .vs-late { color: #ff7a8a; } :root[data-dark="1"] .vs-early { color: #7ab6ff; }
.vs-note { color: var(--muted); font-size: 12px; }
/* lens: the route number you point at on a tag lifts off it */
.lens { position: fixed; z-index: 5; pointer-events: none; transform: translate(-50%, -50%); }
.lens[hidden] { display: none; }
.lens-in { display: block; animation: lens-pop .42s var(--spring) both; }
.lens .badge { height: 22px; min-width: 26px; font-size: 13.5px; border-radius: 6px; padding: 0 7px;
  box-shadow: 0 0 0 2px #fff, 0 6px 16px rgba(0, 0, 0, .28), 0 1px 3px rgba(0, 0, 0, .2); }
.lens .badge.round { width: 24px; min-width: 24px; height: 24px; padding: 0; }
.lens .lens-more { background: #3a3a3c; color: #fff; }
@keyframes lens-pop { 0% { transform: scale(.75) translateY(2px); opacity: 0; } 60% { transform: scale(1.32) translateY(-3px); opacity: 1; }
  100% { transform: scale(1.22) translateY(-2px); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .lens-in { animation: none; transform: scale(1.22); } }
/* stop card: name, routes, next departures */
.tip.tip-card { display: block; padding: 11px 13px 10px; width: 264px; max-width: 264px; border-radius: 18px; }
.sc-name { font: 650 14.5px/1.25 var(--font-display); color: var(--ink); letter-spacing: -.01em; }
.sc-sub { margin-top: 2px; color: var(--muted); font-size: 12px; }
.sc-sub b { color: var(--ink-2); font-weight: 600; }
.sc-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; align-items: center; }
.sc-badges .badge, .sc-row .badge { height: 20px; min-width: 24px; font-size: 12px; padding: 0 6px; border-radius: 5px; }
.sc-badges .badge.round, .sc-row .badge.round { width: 22px; min-width: 22px; height: 22px; padding: 0; }
.sc-more { color: var(--muted); font-size: 12px; font-weight: 600; }
.sc-next { margin-top: 9px; padding-top: 8px; border-top: .5px solid var(--hairline); display: grid; gap: 5px; }
.sc-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; font-size: 12.5px; }
.sc-to { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc-t { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
.sc-foot { margin-top: 7px; color: var(--muted); font-size: 11px; }
.loading {
  position: fixed; inset: 0; z-index: 7; display: grid; place-items: center; pointer-events: none;
  transition: opacity .4s ease;
}
.loading.done { opacity: 0; }
.loading .pill {
  position: relative; display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 99px;
  font-weight: 600; font-size: 14px; animation: jelly-pop .6s var(--spring) both;
}
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid var(--fill-2); border-top-color: var(--accent); animation: spin .8s linear infinite; }

/* MapLibre popups and attribution, glassed */
.glass-pop .maplibregl-popup-content {
  position: relative; background: var(--glass) !important; color: var(--ink);
  -webkit-backdrop-filter: blur(18px) saturate(185%) brightness(1.04); backdrop-filter: blur(18px) saturate(185%) brightness(1.04);
  border-radius: 22px !important; padding: 12px !important;
  box-shadow: inset 0 0 0 .5px var(--rim), inset 1.5px 1.5px 1px -1px var(--rim-hi), inset -1px -1px 1px -.5px var(--rim-lo),
    inset 0 0 18px -6px var(--glow), var(--shadow) !important; font: 14px/1.4 var(--font);
  animation: jelly-pop .5s var(--spring) both; transform-origin: bottom center;
}
.glass-pop .maplibregl-popup-tip { display: none; }
.glass-pop .maplibregl-popup-close-button {
  top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%; background: var(--fill); color: var(--muted);
  font-size: 17px; line-height: 24px; padding: 0;
}
.pop h3 { margin: 2px 34px 8px 4px; font: 700 15px/1.25 var(--font-display); letter-spacing: -.01em; }
.pop p { margin: 0 4px 8px; color: var(--muted); font-size: 13.5px; }
.pop .group { background: var(--fill); }
.pop .hours { margin: 0 4px 4px; border-collapse: collapse; width: calc(100% - 8px); font-size: 13.5px; background: var(--fill); border-radius: 12px; overflow: hidden; }
.pop .hours th, .pop .hours td { padding: 6px 10px; text-align: left; font-weight: 500; }
.pop .hours th { color: var(--muted); font-weight: 600; width: 40%; }
.pop .hours tr + tr th, .pop .hours tr + tr td { border-top: 1px solid rgba(127, 127, 127, .16); }
.pop .route-row .chev { display: none; }
.maplibregl-ctrl-bottom-right { right: max(0px, env(safe-area-inset-right, 0px)); bottom: env(safe-area-inset-bottom, 0px); }
.maplibregl-ctrl-attrib { background: var(--glass) !important; -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); color: var(--muted); font-size: 10.5px; border-radius: 12px !important; }
.maplibregl-ctrl-attrib a { color: var(--muted) !important; }
.maplibregl-ctrl-attrib-button { filter: none; }
:root[data-dark="1"] .maplibregl-ctrl-attrib-button { filter: invert(1); }

/* ---------- Phones: pull-up sheet ---------- */
@media (max-width: 720px) {
  .sheet {
    top: auto; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); width: auto;
    left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px));
    max-height: 82%; border-radius: 30px;
    transition: max-height .6s var(--spring-soft);
    animation-name: jelly-in;
  }
  .sheet.at-peek { max-height: 176px; }
  .sheet.at-half { max-height: 46%; }
  .sheet.at-full { max-height: 82%; }
  .sheet.at-peek .sheet-body { visibility: hidden; }
  .sheet-head { padding: 4px 16px 12px; }
  .grabber {
    display: grid; place-items: center; justify-self: center; width: 64px; height: 18px; padding: 0; border: 0; background: none; cursor: pointer;
  }
  .grabber span { width: 38px; height: 5px; border-radius: 3px; background: var(--fill-2); transition: width .4s var(--spring); }
  .grabber:active span { width: 50px; }
  .app-icon, .app-icon svg { width: 36px; height: 36px; border-radius: 9px; }
  .titles h1 { font-size: 18px; }
  .titles p { font-size: 12px; }
  .results { max-height: 40vh; }
  .controls { top: calc(10px + env(safe-area-inset-top, 0px)); }
  .maplibregl-ctrl-bottom-right { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div id="map" role="region" aria-label="Transit map"></div>

<aside class="sheet glass" id="panel" aria-label="Map panel">
  <header class="sheet-head" id="sheetHead">
    <button class="grabber" id="grabber" type="button" aria-expanded="true" aria-label="Collapse panel"><span></span></button>
    <div class="title-row">
      <span class="app-icon" aria-hidden="true">
        <svg viewBox="0 0 44 44" width="44" height="44">
          <defs>
            <linearGradient id="ai-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a3e"/><stop offset="1" stop-color="#0f0f11"/></linearGradient>
            <linearGradient id="ai-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".45" stop-color="#fff" stop-opacity=".04"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>

<script id="geom-src">/* King County Transit Map — line geometry engine.
 *
 * Turns the street network (site/data/network.json) into what the map draws for one view:
 * one continuous path per corridor with rounded corners and lanes kept through junctions,
 * the selected route on top, and the route-number tags. It is pure computation (no map, no
 * page), so the page runs it in a background worker and the map stays smooth while it works;
 * where workers aren't allowed the page runs the same code itself.
 *
 *   KCTMGeom.createEngine({ edges, lines, cat, gap }) -> { build(params) }
 *     edges  network.json edges: { c: [[lon, lat]...], l: [line index...] }
 *     lines  per line index: { cat, rank }
 *     cat    the corridor table (width, tier, priority, inner style per service type)
 *     gap    space between side-by-side corridors, in line units
 */
const KCTMGeom = (() => {
  "use strict";

  // Local flat coordinates in meters around Seattle (plenty accurate at city scale)
  const LAT0 = 47.61, LON0 = -122.33;
  const KX = 111320 * Math.cos(LAT0 * Math.PI / 180), KY = 110574;
  const MPP0 = 156543.03392 * Math.cos(LAT0 * Math.PI / 180); // meters per pixel at zoom 0
  const toM = (lon, lat) => [(lon - LON0) * KX, (lat - LAT0) * KY];
  const toLL = (p) => [Math.round((LON0 + p[0] / KX) * 1e6) / 1e6, Math.round((LAT0 + p[1] / KY) * 1e6) / 1e6];
  const VKEY = (cat) => (cat === "amtrak" ? "sounder" : cat); // Amtrak shares Sounder's tracks and line

  function simplify(pts, tol) {
    if (pts.length < 3) return pts.slice();
    const keep = new Uint8Array(pts.length);
    keep[0] = keep[pts.length - 1] = 1;
    const stack = [[0, pts.length - 1]], t2 = tol * tol;
    while (stack.length) {
      const [i, j] = stack.pop();
      const [x1, y1] = pts[i], [x2, y2] = pts[j];
      const dx = x2 - x1, dy = y2 - y1, L2 = dx * dx + dy * dy;
      let maxd = -1, idx = -1;
      for (let m = i + 1; m < j; m++) {
        const [x, y] = pts[m];
        let t = L2 ? ((x - x1) * dx + (y - y1) * dy) / L2 : 0;
        t = t < 0 ? 0 : t > 1 ? 1 : t;
        const d = (x1 + t * dx - x) ** 2 + (y1 + t * dy - y) ** 2;
        if (d > maxd) { maxd = d; idx = m; }
      }
      if (maxd > t2) { keep[idx] = 1; stack.push([i, idx], [idx, j]); }

  }
  function cumLen(p) {
    const c = [0];
    for (let i = 1; i < p.length; i++) c.push(c[i - 1] + Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]));
    return c;
  }
  function pointAt(p, c, d) {
    const L = c[c.length - 1];
    if (d <= 0) return p[0];
    if (d >= L) return p[p.length - 1];
    let i = 1;
    while (c[i] < d) i++;
    const t = (d - c[i - 1]) / ((c[i] - c[i - 1]) || 1);
    return [p[i - 1][0] + t * (p[i][0] - p[i - 1][0]), p[i - 1][1] + t * (p[i][1] - p[i - 1][1])];
  }
  function miters(p) {
    const n = p.length, segN = [], m = new Array(n);
    for (let i = 0; i < n - 1; i++) {
      const dx = p[i + 1][0] - p[i][0], dy = p[i + 1][1] - p[i][1], L = Math.hypot(dx, dy) || 1;
      segN.push([dy / L, -dx / L]); // right-hand normal
    }
    for (let i = 0; i < n; i++) {
      if (i === 0) { m[i] = segN[0]; continue; }
      if (i === n - 1) { m[i] = segN[n - 2]; continue; }
      const a = segN[i - 1], b = segN[i];
      let x = a[0] + b[0], y = a[1] + b[1];
      const L = Math.hypot(x, y);
      if (L < 1e-6) { m[i] = b; continue; }
      x /= L; y /= L;
      const sc = 1 / Math.max(x * b[0] + y * b[1], 0.55);
      m[i] = [x * sc, y * sc];
    }
    return m;
  }
  const unitVec = (a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1; return [dx / L, dy / L]; };

  function chainsFor(edges) {
    const dirAt = (E, end) => {
      const p = E.pts, n = p.length, c = E.cum || (E.cum = cumLen(p)), L = c[n - 1];
      const look = Math.min(L * 0.5, 30);
      return end === "a" ? unitVec(p[0], pointAt(p, c, look)) : unitVec(p[n - 1], pointAt(p, c, L - look));
    };
    const at = new Map();
    for (const E of edges) {
      for (const end of ["a", "b"]) {
        if (!at.has(E[end])) at.set(E[end], []);
        at.get(E[end]).push({ E, end });
      }
    }
    const link = new Map();
    const key = (x) => `${x.E.k}${x.end}`;
    for (const list of at.values()) {
      if (list.length < 2) continue;
      const dirs = list.map((x) => dirAt(x.E, x.end));
      const cand = [];
      for (let i = 0; i < list.length; i++) {
        for (let j = i + 1; j < list.length; j++) {
          if (list[i].E !== list[j].E) cand.push([dirs[i][0] * dirs[j][0] + dirs[i][1] * dirs[j][1], i, j]);
        }
      }
      cand.sort((a, b) => a[0] - b[0]);
      const used = new Set();
      for (const [d, i, j] of cand) {
        if (used.has(i) || used.has(j) || d > 0.8 || (list.length > 2 && d > 0.3)) continue;
        used.add(i); used.add(j);
        link.set(key(list[i]), list[j]);
        link.set(key(list[j]), list[i]);
      }
    }
    const seen = new Set(), chains = [];
    const walk = (E, from) => {
      const steps = [];
      while (E && !seen.has(E.k)) {
        seen.add(E.k);
        const fwd = from === "a";
        steps.push({ E, fwd });
        const nxt = link.get(`${E.k}${fwd ? "b" : "a"}`);
        if (!nxt) break;
        E = nxt.E; from = nxt.end;
      }
      return steps;
    };
    for (const E of edges) for (const end of ["a", "b"]) if (!seen.has(E.k) && !link.has(`${E.k}${end}`)) chains.push(walk(E, end));
    for (const E of edges) if (!seen.has(E.k)) chains.push(walk(E, "a"));
    return chains.filter((c) => c.length);
  }

  // Sample a polyline (with cumulative lengths c) at sorted distances ds, in one pass.
  function sampleAt(p, c, ds) {
    const out = [];
    let i = 1;
    for (const d of ds) {
      while (i < p.length - 1 && c[i] < d) i++;
      const t = Math.max(0, Math.min(1, (d - c[i - 1]) / ((c[i] - c[i - 1]) || 1)));
      out.push([p[i - 1][0] + t * (p[i][0] - p[i - 1][0]), p[i - 1][1] + t * (p[i][1] - p[i - 1][1])]);
    }
    return out;
  }

  // One continuous path along `steps`, sitting in lane `key` of each segment. Corners are
  // rounded to suit the bundle width; lane changes are eased steps that may overlap, so a
  // line crossing a busy street glides across instead of jogging. Calls emit(stepIndex, coords).
  // Simplify a run's centerline across its junctions (schematic: small jogs and hooks go),
  // keeping every junction as a vertex but moved onto the simplified line, so lane changes
  // still happen at the right place.
  function simplifyRun(pts, joints, tol) {
    if (pts.length < 3 || tol <= 0) return [pts, joints];
    const keep = new Uint8Array(pts.length);
    keep[0] = keep[pts.length - 1] = 1;
    const stack = [[0, pts.length - 1]], t2 = tol * tol;
    while (stack.length) {
      const [i, j] = stack.pop();
      const [x1, y1] = pts[i], [x2, y2] = pts[j];
      const dx = x2 - x1, dy = y2 - y1, L2 = dx * dx + dy * dy;
      let maxd = -1, idx = -1;
      for (let m = i + 1; m < j; m++) {
        const [x, y] = pts[m];
        let t = L2 ? ((x - x1) * dx + (y - y1) * dy) / L2 : 0;
        t = t < 0 ? 0 : t > 1 ? 1 : t;
        const d = (x1 + t * dx - x) ** 2 + (y1 + t * dy - y) ** 2;
        if (d > maxd) { maxd = d; idx = m; }
      }
      if (maxd > t2) { keep[idx] = 1; stack.push([i, idx], [idx, j]); }
    }
    const jset = new Set(joints), out = [], newJ = [];
    let prevKept = 0;
    const nextKept = (i) => { let j = i + 1; while (!keep[j]) j++; return j; };
    for (let i = 0; i < pts.length; i++) {
      if (keep[i]) { out.push(pts[i]); prevKept = i; if (jset.has(i)) newJ.push(out.length - 1); continue; }
      if (!jset.has(i)) continue;
      // a junction dropped by the simplification: put it back, on the simplified line
      const a = pts[prevKept], b = pts[nextKept(i)], q = pts[i];
      const dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy || 1;
      const t = Math.max(0, Math.min(1, ((q[0] - a[0]) * dx + (q[1] - a[1]) * dy) / L2));
      out.push([a[0] + t * dx, a[1] + t * dy]);
      newJ.push(out.length - 1);
    }
    return [out, newJ];
  }

  function drawPath(key, steps, lay, S, emit, water = false, schematic = 0, center = false, rmin = 0) {
    let pts = [], seg = [], joints = [];
    for (let k = 0; k < steps.length; k++) {
      const { E, fwd } = steps[k], Lo = lay[E.k];
      let g = fwd ? Lo.simp : Lo.simp.slice().reverse();
      if (k > 0) { joints.push(pts.length - 1); g = g.slice(1); }
      for (const q of g) pts.push(q);
      // center: a highlighted route runs down the middle of its street (no lanes, so no lane
      // changes to jog through)
      seg.push({ o: center ? 0 : (fwd ? 1 : -1) * (Lo.pos.get(key) + Lo.shift) * S, hw: (Lo.T / 2 + Math.abs(Lo.shift)) * S });
    }
    if (pts.length < 2) return;
    if (schematic > 0) [pts, joints] = simplifyRun(pts, joints, schematic);

    const line = [pts[0]], jointAt = [];
    let jk = 0;
    for (let v = 1; v < pts.length - 1; v++) {
      const P = pts[v], A = pts[v - 1], B = pts[v + 1];
      const isJ = joints[jk] === v;
      const dIn = unitVec(A, P), dOut = unitVec(P, B);
      const cos = dIn[0] * dOut[0] + dIn[1] * dOut[1];
      const hw = isJ ? Math.max(seg[jk].hw, seg[jk + 1].hw) : seg[jk].hw;
      const r = Math.min(Math.max(1.5 * hw + 5, rmin), 0.48 * Math.hypot(P[0] - A[0], P[1] - A[1]), 0.48 * Math.hypot(B[0] - P[0], B[1] - P[1]));
      if (cos > 0.9995 || r < 0.4) {
        line.push(P);
        if (isJ) { jointAt.push(line.length - 1); jk++; }
        continue;
      }
      const p0 = [P[0] - dIn[0] * r, P[1] - dIn[1] * r], p2 = [P[0] + dOut[0] * r, P[1] + dOut[1] * r];
      const N = cos > 0.8 ? 4 : 8;
      for (let q = 0; q <= N; q++) {
        const t = q / N, m = 1 - t;
        line.push([m * m * p0[0] + 2 * m * t * P[0] + t * t * p2[0], m * m * p0[1] + 2 * m * t * P[1] + t * t * p2[1]]);
        if (isJ && q === N / 2) jointAt.push(line.length - 1);
      }
      if (isJ) jk++;
    }
    line.push(pts[pts.length - 1]);

    const c = cumLen(line), total = c[c.length - 1];
    const D = jointAt.map((j) => c[j]);
    const moves = D.map((d, k) => {
      const delta = seg[k + 1].o - seg[k].o;
      // on the water, where ferry routes fan out from a dock, ease across slowly: a quick step
      // reads as a kink in a long straight crossing
      const L = water ? Math.max(220, 40 * Math.abs(delta), 30 * S) : Math.max(14, 3.4 * Math.abs(delta), 6 * S);
      return { d, delta, L };
    }).filter((m) => Math.abs(m.delta) > 0.02);
    const ds = c.slice();
    for (const m of moves) for (let j = -8; j <= 8; j++) ds.push(m.d + (m.L * j) / 8);
    for (const d of D) ds.push(d);
    ds.sort((a, b) => a - b);
    const dd = [];
    for (const d of ds) if (d >= 0 && d <= total && (!dd.length || d - dd[dd.length - 1] > 0.02)) dd.push(d);
    if (dd.length < 2 || total < 0.5) return; // nothing left to draw (a tiny loop, simplified away)
    const P = sampleAt(line, c, dd);
    const mt = miters(P);
    const Q = dd.map((d, j) => {
      let o = seg[0].o;
      for (const m of moves) {
        const t = (d - (m.d - m.L)) / (2 * m.L);
        if (t >= 1) o += m.delta;
        else if (t > 0) o += m.delta * t * t * (3 - 2 * t);
      }
      return [P[j][0] + mt[j][0] * o, P[j][1] + mt[j][1] * o];
    });

    let from = 0;
    const cuts = D.map((d) => { let b = from; while (b < dd.length - 1 && dd[b] < d - 0.01) b++; from = b; return b; });
    cuts.push(dd.length - 1);
    let start = 0;
    cuts.forEach((end, s) => {
      const piece = [Q[start]];
      for (let j = start + 1; j <= end; j++) {
        const a = piece[piece.length - 1];
        const fwd = (Q[j][0] - a[0]) * (P[j][0] - P[j - 1][0]) + (Q[j][1] - a[1]) * (P[j][1] - P[j - 1][1]);
        if (fwd > 0 || j === end) piece.push(Q[j]);
      }
      emit(s, piece);
      start = end;
    });
  }

  // The network as street segments (meters). Each knows its routes, its service types ("keys")
  // and the left-to-right order of those types along a->b. Shared with the page for hit tests.
  function prepEdges(edges, lines) {
    return edges.map((e, k) => {
      const g0 = lines[e.l[0]].group;
      const layer = g0 === "rail" ? "r" : g0 === "water" ? "w" : "s";
      const key = (c) => `${layer}${c[0]},${c[1]}`;
      const byKey = new Map(), sum = new Map();
      e.l.forEach((i, idx) => {
        const v = VKEY(lines[i].cat);
        if (!byKey.has(v)) { byKey.set(v, []); sum.set(v, 0); }
        byKey.get(v).push(i);
        sum.set(v, sum.get(v) + idx);
      });

    const tip = $("#tip");
    const hitLayers = () => ["sel-stops", "hov-stops", "stations", "stops", "flex"].filter((l) => map.getLayer(l) && map.getLayoutProperty(l, "visibility") !== "none");
    const vehAt = (pt, rad) => (map.getLayer("veh-icon") && map.getLayoutProperty("veh-icon", "visibility") !== "none"
      ? qrf([[pt.x - rad, pt.y - rad], [pt.x + rad, pt.y + rad]], { layers: ["veh-icon"] }) : []);
    let tipTimer = 0;
    const hideTip = () => { clearTimeout(tipTimer); tipTimer = setTimeout(() => { tip.hidden = true; }, 120); };
    const showTipAt = (ev) => { clearTimeout(tipTimer); placeTip(ev); };
    map.on("mousemove", (e) => {
      // a number on a route tag
      const tg = tagAt(e.point);
      showLens(tg);
      if (tg) {
        map.getCanvas().style.cursor = "pointer";
        highlightStop(null);
        tip.classList.remove("tip-card");
        if (tg.item.r != null) {
          const r = LINES[tg.item.r];
          if (!(selected && selected.type === "route")) focusRoute(r);
          tip.innerHTML = `<span class="tt"><b>${esc(routeTitle(r))}</b><br>${esc(r.name)}</span>`;
        } else {
          setHover(null);
          tip.innerHTML = `<span class="tip-badges">${tg.item.more.slice(0, 12).map((i) => badgeHTML(LINES[i])).join("")}</span>`;
        }
        showTipAt({ clientX: e.originalEvent.clientX, clientY: e.originalEvent.clientY + 14 });
        return;
      }
      const vh = vehAt(e.point, 6);
      if (vh.length) {
        const r = RBY[vh[0].properties.r];
        map.getCanvas().style.cursor = "pointer";
        highlightStop(null);
        tip.classList.remove("tip-card");
        tip.innerHTML = `${badgeHTML(r)}<span class="tt"><b>${esc(routeTitle(r))}</b><span class="vs-row">${vehicleLines(vh[0].properties.id, vh[0].properties.est)}</span></span>`;
        showTipAt(e.originalEvent);
        return;
      }
      const stopHit = qrf([[e.point.x - 5, e.point.y - 5], [e.point.x + 5, e.point.y + 5]], { layers: hitLayers() });
      if (stopHit.length) {
        const p = stopHit[0].properties;
        map.getCanvas().style.cursor = "pointer";
        const lid = stopHit[0].layer.id;
        if (lid === "flex") {
          highlightStop(null);
          tip.classList.remove("tip-card");
          tip.innerHTML = `<span class="tt">${esc("Metro Flex · " + p.name)}</span>`;
        } else {
          highlightStop(stopHit[0]);
          tip.classList.add("tip-card");
          tip.innerHTML = stopCard(p.id, lid === "sel-stops" || lid === "hov-stops" ? p.end : 0);
        }
        showTipAt(e.originalEvent);
        return;
      }
      highlightStop(null);
      tip.classList.remove("tip-card");
      const rs = routesAt(e.point, 4);
      if (rs.length) {
        map.getCanvas().style.cursor = "pointer";
        if (!(selected && selected.type === "route")) {
          const top = qrf([[e.point.x - 4, e.point.y - 4], [e.point.x + 4, e.point.y + 4]],
            { layers: LINE_LAYERS.filter((l) => !l.startsWith("sel") && map.getLayer(l)) })[0];
          setHover(top && top.properties.r === -1 ? top : null, rs);
        }
        const r = rs[0];
        tip.innerHTML = rs.length === 1 ? `${badgeHTML(r)}<span class="tt"><b>${esc(routeTitle(r))}</b><br>${esc(r.name)}</span>`
          : `<span class="tip-badges">${rs.slice(0, 8).map((x) => badgeHTML(x)).join("")}</span>${rs.length > 8 ? `<span class="tt">+${rs.length - 8}</span>` : ""}`;
        showTipAt(e.originalEvent);
      } else {
        map.getCanvas().style.cursor = "";
        hideTip();
        setHover(null);
      }
    });
    map.getCanvas().addEventListener("mouseleave", () => { tip.hidden = true; setHover(null); highlightStop(null); showLens(null); });
    map.on("movestart", () => { showLens(null); });
    map.on("click", (e) => {
      tip.hidden = true;
      closePopup();
      // a number on a route tag opens that route; "+3" lists the rest
      const tg = tagAt(e.point);
      if (tg) {
        showLens(null);
        if (tg.item.r != null) selectRoute(LINES[tg.item.r].id, { fit: false });
        else openPopup(tg.coords, `<div class="pop"><h3>${tg.item.more.length} more routes</h3>${routeRows(tg.item.more.map((i) => LINES[i]).sort(tagOrder))}</div>`);
        return;
      }
      // a tap right on a station's circle opens the station, even with a train or bus on top of it
      const onStation = map.getLayer("stations") && map.getLayoutProperty("stations", "visibility") !== "none"
        ? map.queryRenderedFeatures([[e.point.x - 4, e.point.y - 4], [e.point.x + 4, e.point.y + 4]], { layers: ["stations"] }) : [];
      if (onStation.length) { selectStop(onStation[0].properties.id, { fly: false }); return; }
      const vh = vehAt(e.point, isNarrow() ? 12 : 8);
      if (vh.length) {
        const v = live.vehicles.get(vh[0].properties.id), r = RBY[vh[0].properties.r];
        if (vh[0].properties.est && r) {
          openPopup(vh[0].geometry.coordinates, `<div class="pop"><h3>${esc(routeTitle(r))}</h3><p>${esc(r.name)}</p><p>Estimated position from the timetable${LIVE ? "" : " (live positions show on the website)"}.</p>${routeRows([r])}</div>`, "280px");
          return;
        }
        if (v && r) {
          const age = v.ts ? Math.max(0, Math.round(Date.now() / 1000 - v.ts)) : null;
          openPopup(vh[0].geometry.coordinates, `<div class="pop"><h3>${esc(routeTitle(r))}</h3><p>${esc(r.name)}</p><p class="vs-row">${vehicleLines(v.id, false)}</p>${v.label ? `<p>Vehicle ${esc(v.label)}</p>` : ""}${routeRows([r])}</div>`, "280px");
          return;
        }
      }
      const hit = map.queryRenderedFeatures([[e.point.x - 7, e.point.y - 7], [e.point.x + 7, e.point.y + 7]], { layers: hitLayers() });
      if (hit.length) {
        const f = hit.find((h) => h.layer.id === "stations") || hit[0];
        if (f.layer.id === "flex") {
          openPopup(f.geometry.coordinates, flexHTML(f.properties), "290px");
          return;
        }
        selectStop(f.properties.id, { fly: false });
        return;
      }
      const rs = routesAt(e.point, isNarrow() ? 10 : 6);
      if (rs.length === 1) { selectRoute(rs[0].id, { fit: false }); return; }
      if (rs.length > 1) {
        openPopup(e.lngLat, `<div class="pop"><h3>${rs.length} routes on this street</h3>${routeRows(rs.slice(0, 16))}</div>`);
        return;
      }
      const area = map.queryRenderedFeatures(e.point, { layers: ["flex-fill", "dart-fill", "access-fill"].filter((l) => map.getLayer(l) && map.getLayoutProperty(l, "visibility") !== "none") });
      if (area.length) {
        const f = area.find((a) => a.layer.id === "flex-fill") || area.find((a) => a.layer.id === "dart-fill") || area[0];
        const html = f.layer.id === "flex-fill" ? flexHTML(f.properties) : f.layer.id === "dart-fill"
          ? `<div class="pop"><h3>Dial-a-Ride area · route ${esc(f.properties.route)}</h3><p>Inside this area the DART bus can leave its regular path to pick you up or drop you off. Ask King County Metro to arrange an off-route trip.</p>${f.properties.slug && RBY[f.properties.slug] ? routeRows([RBY[f.properties.slug]]) : ""}</div>`
          : `<div class="pop"><h3>Access paratransit (approximate)</h3><p>Access serves riders with disabilities who can't use fixed-route buses, within ¾ mile of Metro's regular routes while they run. Riders apply for eligibility and book trips ahead. This shading uses the ¾-mile rule around all-day routes.</p></div>`;
        openPopup(e.lngLat, html, "290px");
        return;
      }
      if (selected) clearSelection();
    });
    map.on("zoom", onZoom);
    map.on("moveend", onMoveEnd);
    map.on("zoomend", () => { if (zStep(map.getZoom()) !== curStep) rebuild(); renderLive(); });
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape" || e.target.closest("input")) return;
      if (popup) closePopup();
      else if (selected) clearSelection();
      else if (panelView === "layers") { panelView = "home"; showHome(); }
    });
  }
  // Hover. A line carrying one route: that route's whole path, drawn bold on top, with its stops.
  // A line carrying several: the stretch of street they share, bold, with the stops along it.
  // Nothing else on the map changes. Stops pop in once per line, not on every mouse move.
  let hoverKey = "", hoverTimer = 0, hoverStretch = null;
  const withColor = (feats) => feats.map((f) => ({ ...f, properties: { ...f.properties, c: keyColor(f.properties.cat) } }));
  function focusOff() {
    clearTimeout(hoverTimer);
    hoverKey = "";
    hoverStretch = null;
    hovStopsKey = "";
    if (!map || !map.getSource("hover")) return;
    map.getSource("hover").setData(fc([]));
    map.getSource("hoverstops").setData(fc([]));
  }
  // Hovering shows whole routes, never just a piece: one route, or every route on the line
  // under the pointer (until you click one). They're drawn bold in their own lanes, right over
  // their lines, with their stops when there are only a few routes.
  function focusRoutes(routes) {
    routes = (routes || []).filter((r) => r && LINEIDX[r.id] != null);
    if (!routes.length) return;
    clearTimeout(hoverTimer);
    const key = "r:" + routes.map((r) => r.id).join(",");
    if (key === hoverKey) return;
    hoverKey = key;
    hoverStretch = null;
    requestRoutePaths(routes.map((r) => LINEIDX[r.id]), false, (feats) => {
      if (hoverKey !== key) return;
      const lines = withColor(feats);
      map.getSource("hover").setData(fc(lines));
      if (routes.length <= 4) {
        // stops of each route snap onto that route's own drawn line
        const all = [];
        for (const r of routes) {
          const own = lines.filter((f) => f.properties.r === LINEIDX[r.id]);
          all.push(...snapStops(stopFeatures([r], routes.length === 1), own, "route"));
        }
        map.getSource("hoverstops").setData(fc(all));
        if (hovStopsKey !== key) popIn("hov");
      } else map.getSource("hoverstops").setData(fc([]));
      hovStopsKey = key;
    });
  }
  const focusRoute = (r) => focusRoutes([r]);
  function setHover(feat, routes) {
    if (!feat) { clearTimeout(hoverTimer); hoverTimer = setTimeout(focusOff, 170); return; }
    clearTimeout(hoverTimer);
    const cat = feat.properties.cat, E0 = EDGES[feat.properties.e];
    const own = E0 && E0.byKey.get(cat) ? E0.byKey.get(cat).map((i) => LINES[i]).sort(tagOrder) : routes;
    focusRoutes(own);
  }

  // ---------------------------------------------------------------- route tags you can point at
  // Each number on a tag is its own target: hovering it lifts that number (the lens) and shows
  // that route's whole line and stops; clicking it opens the route.
  const BADGE_LAYOUT = new Map();
  // map lookups during pointer moves can briefly fail while a source is being replaced
  const qrf = (geom, opts) => { try { return map.queryRenderedFeatures(geom, opts); } catch (e) { return []; } };
  function tagAt(pt) {
    if (!map.getLayer("badges") || map.getLayoutProperty("badges", "visibility") === "none") return null;
    if (selected && selected.type === "route") return null; // other routes' tags are faded out then
    const hits = qrf([[pt.x - 1, pt.y - 1], [pt.x + 1, pt.y + 1]], { layers: ["badges"] });
    for (const f of hits) {
      const L = BADGE_LAYOUT.get("b:" + f.properties.k);
      if (!L) continue;
      const c = map.project(f.geometry.coordinates), left = c.x - L.w / 2, top = c.y - L.h / 2, dx = pt.x - left;
      if (dx < 0 || dx > L.w || pt.y < top || pt.y > top + L.h) continue;
      const item = L.items.find((it) => dx >= it.x0 && dx < it.x1) || L.items[L.items.length - 1];
      return { item, left, top, L, coords: f.geometry.coordinates };
    }
    return null;
  }
  let lensKey = "";
  function showLens(hit) {
    const lens = $("#lens");
    if (!hit) { if (lensKey) { lens.hidden = true; lensKey = ""; } return; }
    const key = hit.left.toFixed(0) + "," + hit.top.toFixed(0) + "," + hit.item.x0;
    const rect = map.getCanvas().getBoundingClientRect();
    lens.style.left = rect.left + hit.left + (hit.item.x0 + hit.item.x1) / 2 + "px";
    lens.style.top = rect.top + hit.top + hit.L.h / 2 + "px";
    if (key === lensKey) return;
    lensKey = key;
    const it = hit.item;
    lens.innerHTML = it.r != null ? `<span class="lens-in">${badgeHTML(LINES[it.r])}</span>`
      : `<span class="lens-in"><span class="badge lens-more">+${it.more.length}</span></span>`;
    lens.hidden = false;
  }

  function placeTip(ev) {
    const tip = $("#tip");
    tip.hidden = false;
    const x = Math.min(ev.clientX + 16, window.innerWidth - tip.offsetWidth - 8);
    const y = Math.min(ev.clientY + 16, window.innerHeight - tip.offsetHeight - 8);
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }

  // ---------------------------------------------------------------- phone sheet (peek / half / full)
  const isNarrow = () => window.innerWidth <= 720;
  const DETENTS = ["peek", "half", "full"];
  let sheetState = "peek";
  function setSheet(state) {
    sheetState = state;
    const p = $("#panel");
    DETENTS.forEach((d) => p.classList.toggle(`at-${d}`, d === state));
    const g = $("#grabber");
    g.setAttribute("aria-expanded", String(state !== "peek"));
    g.setAttribute("aria-label", state === "full" ? "Shrink panel" : "Expand panel");
  }
  function openSheet(state = "full") {
    if (!isNarrow()) return;
    if (DETENTS.indexOf(state) > DETENTS.indexOf(sheetState) || state === "half") setSheet(state);
  }
  function setupSheet() {
    setSheet(isNarrow() ? "peek" : "full");
    $("#grabber").addEventListener("click", () => setSheet(sheetState === "full" ? "peek" : DETENTS[DETENTS.indexOf(sheetState) + 1]));
    let y0 = null, t0 = 0;
    $("#sheetHead").addEventListener("pointerdown", (e) => { if (!isNarrow() || e.target.closest("input,button:not(.grabber)")) return; y0 = e.clientY; t0 = performance.now(); });
    window.addEventListener("pointerup", (e) => {
      if (y0 == null) return;
      const dy = e.clientY - y0, fast = performance.now() - t0 < 400, i = DETENTS.indexOf(sheetState);
      if ((dy < -30 || (fast && dy < -10)) && i < 2) setSheet(DETENTS[i + 1]);
      else if ((dy > 30 || (fast && dy > 10)) && i > 0) setSheet(DETENTS[i - 1]);
      y0 = null;
    });
    window.addEventListener("resize", () => { if (!isNarrow()) setSheet("full"); });
  }

  // ---------------------------------------------------------------- hash routing
  function applyHash() {
    const h = decodeURIComponent((location.hash || "").slice(1));
    if (h.startsWith("route-") && RBY[h.slice(6)]) selectRoute(h.slice(6));
    else if (/^(stop|station)-/.test(h) && stopIndex[h.replace(/^(stop|station)-/, "")]) selectStop(h.replace(/^(stop|station)-/, ""));
  }

  // ---------------------------------------------------------------- boot
  async function boot() {
    registerProtocols();
    const getJSON = (u) => fetch(u).then((r) => { if (!r.ok) throw new Error(`${u}: ${r.status}`); return r.json(); });
    const [routes, net, stops, areas, manifest, live] = await Promise.all([
      getJSON("data/routes.json"), getJSON("data/network.json"), getJSON("data/stops.json"), getJSON("data/areas.json"),
      getJSON("tiles/manifest.json").catch(() => null), liveTiles(),
    ]);
    MANIFEST = manifest;
    META = routes.meta; ROUTES = routes.routes; STOPNAMES = routes.stopNames; NET = net; STOPS = stops; AREAS = areas;
    ROUTES.forEach((r, i) => { r._rank = i; RBY[r.id] = r; });
    LINES = NET.lines.map((id) => RBY[id]);
    LINES.forEach((r, i) => { LINEIDX[r.id] = i; });
    RTMAP = new Map(ROUTES.flatMap((r) => (r.rt || []).map((k) => [k, r])));
    prepNetwork();
    startEngine(); // lays out the network in the background while the map loads
    for (const s of STOPS.stops) {
      stopIndex[s.id] = { ...s, kind: "stop", key: s.id };
      for (const a of s.alias || []) stopIndex[a] = stopIndex[s.id];
    }
    for (const s of STOPS.stations) {
      stopIndex[s.id] = { ...s, key: s.id };
      for (const sid of s.stops) if (!stopIndex[sid]) stopIndex[sid] = { ...s, key: s.id };
    }

    const P = BASE[theme];
    const baseSource = live
      ? { type: "vector", tiles: live.tiles, minzoom: 0, maxzoom: 14, attribution: '<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> © <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' }
      : { type: "vector", tiles: ["atlas://{z}/{x}/{y}"], minzoom: 0, maxzoom: manifest ? manifest.maxzoom : 14, attribution: "OpenFreeMap © OpenMapTiles © OpenStreetMap contributors" };
    const R = META.region;
    const narrow = isNarrow();
    const empty = { type: "FeatureCollection", features: [] };
    map = new maplibregl.Map({
      container: "map",
      style: {
        version: 8,
        glyphs: live ? "https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf" : "atlasfont://{fontstack}/{range}",
        sources: {
          base: baseSource,
          net: { type: "geojson", data: empty, tolerance: 0.2, buffer: 96, attribution: "Transit data: Puget Sound GTFS, King County GIS" },
          sel: { type: "geojson", data: empty, tolerance: 0.2 },
          selstops: { type: "geojson", data: empty },
          hoverstops: { type: "geojson", data: empty },
          stophl: { type: "geojson", data: empty },
          hover: { type: "geojson", data: empty, tolerance: 0.2 },
          netlabels: { type: "geojson", data: empty, tolerance: 0.5 },
          sellabels: { type: "geojson", data: empty, tolerance: 0.5 },
          stations: { type: "geojson", data: empty },
          stops: { type: "geojson", data: empty },
          dart: { type: "geojson", data: AREAS.dart },
          access: { type: "geojson", data: AREAS.access },
          flex: { type: "geojson", data: AREAS.flex },
          flexlabels: { type: "geojson", data: AREAS.flexLabels || empty },
          vehicles: { type: "geojson", data: empty },
          mask: { type: "geojson", data: maskGeoJSON() },
        },
        layers: [...baseLayers(P), ...areaLayers(P), ...transitLayers(P), ...stopLayers(P), ...liveLayers(P)],
      },
      bounds: narrow ? [[-122.42, 47.54], [-122.17, 47.72]] : [[-122.44, 47.50], [-122.10, 47.77]],
      fitBoundsOptions: { padding: narrow ? { top: 20, bottom: 150, left: 10, right: 10 } : { top: 30, bottom: 30, left: 420, right: 80 } },
      maxBounds: [[R.west - 0.4, R.south - 0.3], [R.east + 0.4, R.north + 0.3]],
      minZoom: 9, maxZoom: 18.5, dragRotate: false, pitchWithRotate: false, touchPitch: false,
      attributionControl: false,
    });
    window.__map = map; // handy for debugging from the console
    window.__atlas = {
      rebuild, timeRebuild: () => { const t = performance.now(); rebuild(); return performance.now() - t; },
      inWorker: () => !!worker, lastBuildMs: () => lastBuildMs,
      idle: () => new Promise((res) => { if (!inFlight && !queued) res(); else idleWaiters.push(res); }),
    };
    map.touchZoomRotate.disableRotation();
    map.addControl(new maplibregl.AttributionControl({ compact: true }), "bottom-right");
    map.on("styleimagemissing", (e) => {
      if (e.id.startsWith("veh:")) drawVehicle(e.id);
      else if (e.id.startsWith("b:")) drawBadge(e.id);
      else if (e.id.startsWith("arr:")) drawArrow(e.id);
    });
    map.on("load", () => {
      refreshStations();
      map.getSource("stops").setData(stopsGeoJSON());
      applyLayerToggles();
      applyTheme();
      const attrib = document.querySelector(".maplibregl-ctrl-attrib");
      if (attrib) attrib.classList.remove("maplibregl-compact-show");
      $("#loading").classList.add("done");
      setTimeout(() => { $("#loading").hidden = true; }, 450);
      buildSearch();
      setupSearch();
      setupInteraction();
      showHome();
      applyHash();
      loadSchedule();
    });
  }

  // ---------------------------------------------------------------- liquid glass behavior
  // A soft highlight follows the pointer across glass surfaces, and tapped controls
  // squash and spring back like jelly.
  function setupGlass() {
    let raf = 0, last = null;
    document.addEventListener("pointermove", (e) => {
      last = e;
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        const el = last.target.closest && last.target.closest(".glass");
        if (!el) return;
        const b = el.getBoundingClientRect();
        el.style.setProperty("--mx", `${((last.clientX - b.left) / b.width * 100).toFixed(1)}%`);
        el.style.setProperty("--my", `${((last.clientY - b.top) / b.height * 100).toFixed(1)}%`);
      });
    }, { passive: true });
    document.addEventListener("pointerdown", (e) => {
      const el = e.target.closest && e.target.closest(".ctl, .back, .link-out, .chip, .result, .route-row, .grabber");
      if (!el || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      el.classList.remove("squish"); void el.offsetWidth; el.classList.add("squish");
    }, { passive: true });
    document.addEventListener("animationend", (e) => { if (e.animationName === "squish") e.target.classList.remove("squish"); });
  }

  // ---------------------------------------------------------------- page chrome
  function setupChrome() {
    setupGlass();
    setupSheet();
    $("#zoomIn").addEventListener("click", () => map && map.zoomIn({ duration: 350 }));
    $("#zoomOut").addEventListener("click", () => map && map.zoomOut({ duration: 350 }));
    const tb = $("#themeBtn");
    const cycle = { "": "dark", dark: "light", light: "" };
    const label = () => {
      const t = document.documentElement.getAttribute("data-theme") || "";
      tb.setAttribute("aria-label", t ? `Appearance: ${t}. Change appearance` : "Appearance: automatic. Change appearance");
      tb.title = t ? `Appearance: ${t}` : "Appearance: automatic";
    };
    const saved = store.get("theme", "");
    if (saved && !document.documentElement.getAttribute("data-theme")) document.documentElement.setAttribute("data-theme", saved);
    label();
    tb.addEventListener("click", () => {
      const cur = document.documentElement.getAttribute("data-theme") || "";
      const next = cycle[cur];
      if (next) document.documentElement.setAttribute("data-theme", next); else document.documentElement.removeAttribute("data-theme");
      store.set("theme", next);
      label();
    });
    mq.addEventListener("change", applyTheme);
    new MutationObserver(() => { if (themeName() !== theme) applyTheme(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    window.addEventListener("hashchange", applyHash);
    document.documentElement.setAttribute("data-dark", theme === "dark" ? "1" : "0");
  }

  setupChrome();
  boot().catch((err) => {
    console.error(err);
    const l = $("#loading");
    l.hidden = false;
    l.classList.remove("done");
    l.querySelector(".pill").textContent = "The map data didn't load. Reload the page to try again.";
  });
})();
</script>
</body>
